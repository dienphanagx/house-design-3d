function orbit(m,p,t,roof){mode=m;oc.enabled=true;shell.visible=roof;cam.position.set(p[0],p[1],p[2]);oc.target.set(t[0],t[1],t[2]);cam.fov=45;cam.updateProjectionMatrix();oc.update();
  document.getElementById('pad').style.display='none';setBtn();
  hint.textContent=(roof?'Xem ngoài: kéo để xoay, cuộn hoặc chụm tay để phóng to.':'Đã mở mái và trần: kéo để xoay, phóng to để nhìn từng phòng.')+' Mặt bằng 7 × 13 m, không tính sân phơi. Thiết kế sơ bộ, kích thước thông thủy (trong tường).';}
function walkTo(r){mode='walk';oc.enabled=false;shell.visible=true;cam.fov=70;cam.updateProjectionMatrix();
  var cx=r?(r[2]+r[4])/2:4.5,cy=r?(r[3]+r[5])/2:10.2;cam.position.set(cx,1.55,-cy);
  yaw=(r&&(r[4]-r[2])>(r[5]-r[3]))?-Math.PI/2:0;pitch=-0.05;pad();setBtn();
  hint.textContent='Đang ở: '+(r?r[1]:'Phòng khách')+'. Kéo chuột/ngón tay để nhìn quanh; W A S D hoặc nút ▲▼ để đi (không xuyên tường); ← → để quay.';}
function sit(){mode='walk';oc.enabled=false;shell.visible=true;cam.fov=70;cam.updateProjectionMatrix();
  cam.position.set(2.5,1.2,-3.95);yaw=0;pitch=0;pad();setBtn();
  hint.textContent='Đang ngồi ở bàn ăn, phía trước là kệ tivi; dãy bếp dài nằm sau lưng, sát phòng ngủ 2. Kéo để nhìn quanh, W A S D để đi.';}
B.out.onclick=function(){orbit('out',[12,6,-20],[3.5,1.8,-6.5],true);};
B.cut.onclick=function(){orbit('cut',[9,15,-18],[3.5,0,-6.5],false);};
B.walk.onclick=function(){walkTo(RM[2]);};
var sb=document.createElement('button');sb.textContent='Góc ngồi ăn';sb.onclick=sit;wrap.insertBefore(sb,wrap.firstChild);
var dr=null;
ren.domElement.addEventListener('pointerdown',function(e){if(mode==='walk')dr=[e.clientX,e.clientY];});
addEventListener('pointerup',function(){dr=null;});
addEventListener('pointermove',function(e){if(mode==='walk'&&dr){yaw-=(e.clientX-dr[0])*0.005;pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-dr[1])*0.005));dr=[e.clientX,e.clientY];}});
addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1;});
addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0;});
document.querySelectorAll('#pad button').forEach(function(b){var k=b.dataset.k;
  b.addEventListener('pointerdown',function(){keys['pad'+k]=1;});['pointerup','pointerleave'].forEach(function(n){b.addEventListener(n,function(){keys['pad'+k]=0;});});});
function hit(x,Y){for(var i=0;i<solids.length;i++){var s=solids[i];if(x>s[0]-0.22&&x<s[2]+0.22&&Y>s[1]-0.22&&Y<s[3]+0.22)return true;}
  return x<0.45||x>6.55||Y<0.1||Y>11.85;}
var last=performance.now();
function loop(now){requestAnimationFrame(loop);var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(mode==='walk'){
    var f=((keys.w||keys.arrowup||keys.padw)?1:0)-((keys.s||keys.arrowdown||keys.pads)?1:0),sd=(keys.d?1:0)-(keys.a?1:0);
    yaw+=(((keys.arrowleft||keys.q||keys.padl)?1:0)-((keys.arrowright||keys.e||keys.padr)?1:0))*1.6*dt;
    var sp=1.6*dt,dx=(-Math.sin(yaw)*f+Math.cos(yaw)*sd)*sp,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*sd)*sp;
    var nx=cam.position.x+dx,nz=cam.position.z+dz;
    if(!hit(nx,-cam.position.z))cam.position.x=nx;
    if(!hit(cam.position.x,-nz))cam.position.z=nz;
    cam.rotation.set(pitch,yaw,0);
  } else oc.update();
  ren.render(scene,cam);}
function size(){var w=host.clientWidth,h=host.clientHeight;ren.setSize(w,h);ren.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
orbit('cut',[9,15,-18],[3.5,0,-6.5],false);
requestAnimationFrame(loop);
})();
</script>
</body>
