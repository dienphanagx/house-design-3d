<!doctype html>
<html lang="vi">

<style>

*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg)}
#app{height:100dvh;min-height:400px;position:relative;overflow:hidden}#view{position:absolute;inset:0;touch-action:none}canvas{display:block}
.controls{position:absolute;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}.controls>*{pointer-events:auto}
#top{top:12px}#rooms{top:66px;max-height:87px;overflow:auto;align-content:flex-start;scrollbar-width:thin}
button{font:inherit;font-size:13px;font-weight:600;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px;min-height:39px;box-shadow:0 2px 8px #0001;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}button.active{background:var(--accent);color:var(--active);border-color:var(--accent)}#rooms button{font-size:12px;min-height:34px;padding:6px 10px}
#note{position:absolute;bottom:12px;left:12px;right:12px;max-width:790px;background:var(--panel);padding:10px 13px;border:1px solid var(--border);border-radius:10px;font-size:12px;line-height:1.5;box-shadow:0 3px 16px #0001}
#pad{position:absolute;right:12px;bottom:93px;display:none;grid-template-columns:repeat(3,45px);gap:6px}#pad button{font-size:18px;height:45px;padding:0}
#floorplan{position:absolute;inset:0;display:none;overflow:auto;padding:168px 12px 80px;justify-content:center;align-items:flex-start;background:linear-gradient(140deg,#e4edeb,#cddbd6)}
#paper{width:min(100%,580px);flex-shrink:0;background:#fff;padding:14px;border-radius:13px;box-shadow:0 14px 38px #25483d24}#paper h1{font-size:17px;text-align:center;margin:3px 0 4px}#paper p{text-align:center;color:#697873;font-size:12px;margin:0 0 12px}
#plan-svg{width:100%;height:auto;display:block}#plan-svg .rm{cursor:pointer}#plan-svg .rm:hover{fill-opacity:.85}#plan-svg text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;pointer-events:none}#paper small{display:block;color:#6a7d76;line-height:1.5;margin:9px 3px 2px}
.window-spec{width:100%;border-collapse:collapse;margin-top:9px;font-size:12px;text-align:left}
.window-spec th,.window-spec td{border-bottom:1px solid #dee5e1;padding:8px 5px;vertical-align:top}
.window-spec th{background:#edf5f2;color:#315b50}
.window-heading{margin:18px 4px 8px;font-size:15px;color:#315b50}
.window-desc{margin:7px 3px;font-size:12px;line-height:1.55;color:#526e65}
#window-modal{position:absolute;inset:0;background:#18342fa1;z-index:9;display:none;align-items:center;justify-content:center;padding:12px}
#window-modal.open{display:flex}
#window-box{background:white;border-radius:14px;padding:18px;max-width:670px;width:100%;max-height:88dvh;overflow:auto;box-shadow:0 12px 55px #0019}
#window-box h2{font-size:18px;margin:4px 0}
#window-box .close{float:right}
#paper .window-desc,#window-box .window-desc{text-align:left}
@media(max-width:520px){.window-spec{font-size:11px}.window-spec th,.window-spec td{padding:6px 3px}}

@media(max-width:520px){#top{gap:5px}#top button{font-size:11px;padding:7px 9px;min-height:36px}#rooms{top:100px;max-height:76px}#rooms button{font-size:11px}#floorplan{padding-top:182px}#note{font-size:11px;max-width:none}#pad{bottom:112px}}

.hide-dimensions .dimension,.hide-dimensions #inline-spec .window-spec{display:none}
#plan-svg .rm{cursor:default}
</style>
</head>

<div id="app" class="hide-dimensions">
  <div id="view"></div>
  <div id="floorplan"><div id="paper"><h1>MẶT BẰNG NHÀ HỘP 1 TẦNG</h1><p>Mái bằng kiểu nhà hộp · Cửa sổ được căn theo từng phòng</p><svg id="plan-svg" viewBox="-30 -50 790 1580" role="img" aria-label="Sơ đồ nhà gồm hiên cửa, phòng khách, 2 phòng ngủ, phòng bếp, nhà vệ sinh và kho"></svg><small>Bật Kích thước để xem số đo đồng thời trong 2D và 3D. Chọn phòng để xem 3D. Bản bố trí sơ bộ, chưa phải bản vẽ kỹ thuật.</small><div id="inline-spec"></div></div></div>
  <nav id="top" class="controls" aria-label="Chế độ xem">
    <button id="outside">🏠 Có mái</button><button id="cut">◈ 3D mở mái</button><button id="plan">▦ Sơ đồ 2D</button><button id="walk">🚶 Điều khiển nhân vật</button><button id="site-view" type="button">🌳 Xem khu đất</button><button id="windows-btn" type="button" aria-pressed="false">📏 Kích thước: tắt</button>
  </nav>
  <nav id="walk-tools" class="controls" style="display:none" aria-label="Góc nhìn đi bộ"><button id="walk-camera" type="button">👤 Nhìn theo nhân vật</button><label style="background:#fffffff0;padding:8px;border-radius:10px;font-size:12px">Góc rộng <input id="walk-fov" type="range" min="40" max="120" value="100" aria-label="Góc nhìn rộng"> <span id="walk-fov-value">100°</span></label></nav>
  <div id="pad"><span></span><button data-key="w" aria-label="Tiến">▲</button><span></span><button data-key="q" aria-label="Trái">◀</button><button data-key="s" aria-label="Lùi">▼</button><button data-key="e" aria-label="Phải">▶</button></div>
  <div id="note"></div>
<div id="window-modal" aria-label="Danh sách kích thước cửa"><div id="window-box"><button id="window-close" class="close" type="button">Đóng ✕</button><h2>Bảng cửa sổ & cửa kính đề xuất</h2><div id="modal-spec"></div></div></div>

const doorTable='<h3 class="window-heading">Kích thước cửa đi</h3><table class="window-spec"><thead><tr><th>Mã</th><th>Vị trí</th><th>Ngang × cao</th></tr></thead><tbody>'+doorRows.map(([id,where,size])=>'<tr><td><b>'+id+'</b></td><td>'+where+'</td><td>'+size+'</td></tr>').join('')+'</tbody></table>';

<text x="223" y="225" text-anchor="middle" fill="#476c63" font-size="21" font-family="system-ui">HIÊN MỞ · CỬA KÍNH PHÒNG KHÁCH</text>

const specHTML='<p class="window-desc">Kích thước ghi theo <b>ngang × cao</b>, đơn vị mét. Bậu cửa tính từ mặt sàn hoàn thiện. Mã màu xanh trên sơ đồ tương ứng từng cửa.</p><table class="window-spec"><thead><tr><th>Mã</th><th>Phòng / vị trí</th><th>Ngang × cao</th><th>Bậu</th></tr></thead><tbody>'+specData.map(o=>'<tr><td><b>'+o.code+'</b></td><td>'+o.room+'<div style="color:#647a73">'+o.note+'</div></td><td>'+o.size+'</td><td>'+o.sill+'</td></tr>').join('')+'</tbody></table>'+doorTable+'<p class="window-desc"><b>Đã bỏ:</b> cửa phía sau nhà và cửa sổ bên phải khu bếp. Khu bếp dùng cửa kính lùa D1 bên hông để lấy sáng, thông gió và ra vào.</p><p class="window-desc">Mái bằng có tường chắn mái và hướng thoát nước minh họa; độ dốc, thoát nước, chống thấm, kết cấu và khoảng cách tới nhà bên cạnh cần kiến trúc sư/kỹ sư xác nhận trước khi thi công.</p>';
document.getElementById('inline-spec').innerHTML=elevationHTML+'<div class="dimension"><h2 class="window-heading">Kích thước các cửa</h2>'+specHTML+'</div>';

 {id:'hien',name:'Cửa vào / hiên',short:'CỬA / HIÊN',dims:'1,8 × 4,2 m',area:'≈ 7,6 m²',rect:[.18,.18,4.29,2.02],color:0xe9dbbf,svg:'#f7ead1',spot:[2.15,1.1],angle:0},

 {id:'ngu2',name:'Phòng ngủ 2',short:'PHÒNG NGỦ 2',dims:'3 × 4 m',area:'12 m²',rect:[4.43,4.35,7.12,7.97],color:0xd1d9f1,svg:'#e1e6f8',spot:[4.92,5.2],angle:-Math.PI/2},
 {id:'bep',name:'Phòng bếp',short:'PHÒNG BẾP',dims:'7,3 × 2,9 m',area:'≈ 21 m²',rect:[.18,8.13,7.12,10.98],color:0xf1deb9,svg:'#faeacb',spot:[1.65,9.20],angle:0},

 {id:'V1',axis:'h',a:4.36,b:7.22,pos:.08,doors:[[4.43,7.11,3.35]],windows:[]},

 {id:'V11',axis:'v',a:11.06,b:12.92,pos:2.46,doors:[],windows:[]}
];
const columnSize=.25;
const fmt=n=>Number(n.toFixed(2)).toString().replace('.',',');
rooms.forEach(r=>{const a=r.rect,w=sx(a[2]-a[0]),d=a[3]-a[1];r.dims=fmt(w)+' × '+fmt(d)+' m';r.area='≈ '+fmt(w*d)+' m²';});

function mirrorDrawing(svg,width){
 const g=document.createElementNS(NS,'g');
 while(svg.firstChild)g.appendChild(svg.firstChild);
 svg.appendChild(g);mirrorDrawings.push({g,width,model:svg===sv});

function updateMirrorDrawings(){
 mirrorDrawings.forEach(({g,width,model})=>{

 });

[8.98,9.22].forEach(y=>{const ring=new T.Mesh(new T.TorusGeometry(.095,.008,6,28),mat(0x78858a));ring.rotation.x=Math.PI/2;ring.position.set(6.75,FLOOR+.952,-y);scene.add(ring);});
// Đèn trần bổ sung ánh sáng dịu cho nội thất.
rooms.filter(r=>r.id!=='hien').forEach((r,i)=>{
 const [x0,y0,x1,y1]=r.rect,x=(x0+x1)/2,y=(y0+y1)/2;
 const lamp=new T.Mesh(new T.CylinderGeometry(.16,.16,.025,20),new T.MeshStandardMaterial({color:0xfff3dc,emissive:0xffdfad,emissiveIntensity:.8,roughness:.5}));lamp.position.set(x,TOP+.20,-y);ceiling.add(lamp);

const house=new T.Group();scene.children.slice().filter(c=>(!c.isLight||c.name.startsWith('interior-light-'))&&c!==sun.target).forEach(c=>house.add(c));scene.add(house);house.scale.x=X_SCALE;


// Nhân vật tính bằng mét trong không gian thực, không bị kéo giãn theo nhà.
const PLAYER_HEIGHT=1.65,EYE_HEIGHT=1.54,playerPosition=new T.Vector3();

function personPart(geometry,color,x,y,z,parent=avatar){const m=new T.Mesh(geometry,mat(color));m.position.set(x,y,z);parent.add(m);return m;}
personPart(new T.BoxGeometry(.38,.48,.23),0x3d738c,0,1.10,0);
personPart(new T.CylinderGeometry(.065,.065,.08,10),0xd4a27d,0,1.38,0);
personPart(new T.SphereGeometry(.12,16,12),0xd4a27d,0,1.53,0);
personPart(new T.BoxGeometry(.36,.13,.24),0x344c63,0,.795,0);
const walkingLimbs=[];
[-1,1].forEach(side=>{
 const leg=new T.Group();leg.position.set(side*.10,.78,0);avatar.add(leg);
 personPart(new T.BoxGeometry(.13,.65,.15),0x344c63,0,-.325,0,leg);
 personPart(new T.BoxGeometry(.15,.13,.26),0x4a4740,0,-.715,-.045,leg);walkingLimbs.push({part:leg,sign:side});
 const arm=new T.Group();arm.position.set(side*.245,1.30,0);avatar.add(arm);
 personPart(new T.BoxGeometry(.10,.47,.12),0x3d738c,0,-.235,0,arm);

});
playerPosition.set(isMirrored?HOUSE_WIDTH-sx(2.2):sx(2.2),-.045,3.8);avatar.position.copy(playerPosition);avatar.visible=true;
let thirdPerson=true,walkFov=100,firstPersonFov=100,thirdPersonFov=100,stepPhase=0;
const followRay=new T.Raycaster();
function walkingFloor(x,y){const cx=(isMirrored?HOUSE_WIDTH-x:x)/X_SCALE;return y>=0&&y<=L?FLOOR+.016:((cx<0&&y>=-.60&&y<=13.30)?FLOOR:-.045);}
function updateWalkCamera(){
 const floor=walkingFloor(playerPosition.x,-playerPosition.z);playerPosition.y=floor;
 avatar.position.copy(playerPosition);avatar.rotation.y=yaw;avatar.visible=mode==='walk'&&thirdPerson;
 const eye=playerPosition.clone().add(new T.Vector3(0,EYE_HEIGHT,0));
 cam.rotation.set(pitch,yaw,0);cam.position.copy(eye);
 if(thirdPerson){
  const back=new T.Vector3(0,.25,2.8).applyEuler(new T.Euler(pitch,yaw,0,'YXZ'));
  followRay.set(eye,back.clone().normalize());followRay.far=back.length();
  const hit=followRay.intersectObjects(measurementOccluders,false).find(h=>h.distance>.05);
  const distance=hit?Math.max(.08,hit.distance-.14):back.length();
  cam.position.addScaledVector(back.normalize(),distance);
  avatar.visible=distance>.55;
 }
}
document.getElementById('walk-camera').onclick=function(){thirdPerson=!thirdPerson;walkFov=thirdPerson?thirdPersonFov:firstPersonFov;document.getElementById('walk-fov').value=walkFov;document.getElementById('walk-fov-value').textContent=walkFov+'°';cam.fov=walkFov;cam.updateProjectionMatrix();this.textContent=thirdPerson?'👤 Nhìn theo nhân vật':'👁 Nhìn qua mắt';if(mode==='walk')updateWalkCamera();};
document.getElementById('walk-fov').oninput=function(){walkFov=Number(this.value);if(thirdPerson)thirdPersonFov=walkFov;else firstPersonFov=walkFov;document.getElementById('walk-fov-value').textContent=walkFov+'°';if(mode==='walk'){cam.fov=walkFov;cam.updateProjectionMatrix();}};

let yaw=0,pitch=0;const keys={};
const originalSolids=solids.map(a=>a.slice());
solids=originalSolids.map(([x0,y0,x1,y1])=>[sx(x0),y0,sx(x1),y1]);
// Chỉ giữ vài vách gần góc nhìn; nhãn không xuyên tường và không đè nhau.
const measurementOccluders=[];house.traverse(o=>{if(o.isMesh&&!o.material.transparent){let p=o,inLandscape=false;while(p){if(p===surroundings){inLandscape=true;break;}p=p.parent;}if(!inLandscape)measurementOccluders.push(o);}});
const measurementRay=new T.Raycaster(),viewPoint=new T.Vector3(),rayDirection=new T.Vector3();
let lastMeasurementView='';
function updateMeasurementVisibility(){
 if(!measurements3D.visible)return;
 const signature=[mode,isMirrored,cam.position.x.toFixed(2),cam.position.y.toFixed(2),cam.position.z.toFixed(2),cam.quaternion.x.toFixed(3),cam.quaternion.y.toFixed(3),cam.quaternion.z.toFixed(3),host.clientWidth,host.clientHeight].join('|');
 if(signature===lastMeasurementView)return;lastMeasurementView=signature;
 house.updateMatrixWorld(true);cam.updateMatrixWorld(true);
 const cx=(isMirrored?HOUSE_WIDTH-cam.position.x:cam.position.x)/X_SCALE,cy=-cam.position.z;
 const exterior={V1:cy<.08,V2:cy>12.92,V3:cx<.08,V4:cx>7.22};
 const groups=[...wallMeasurementGroups.values()];
 const ranked=groups.filter(g=>mode!=='outside'||exterior[g.userData.wall.id]).sort((a,b)=>{
  function distance(g){const w=g.userData.wall,x=w.axis==='h'?(w.a+w.b)/2:w.pos,y=w.axis==='h'?w.pos:(w.a+w.b)/2;return (cx-x)**2+(cy-y)**2;}
  return distance(a)-distance(b);
 });
 const selected=new Set(ranked.slice(0,mode==='outside'?2:3));groups.forEach(g=>g.visible=selected.has(g));
 const labels=[];measurements3D.traverse(o=>{if(o.isSprite){o.visible=true;if(o.parent===measurements3D||selected.has(o.parent))labels.push(o);}});
 const occupied=[];let shown=0;
 labels.sort((a,b)=>a.getWorldPosition(new T.Vector3()).distanceToSquared(cam.position)-b.getWorldPosition(new T.Vector3()).distanceToSquared(cam.position));
 for(const sprite of labels){
  sprite.getWorldPosition(viewPoint);rayDirection.copy(viewPoint).sub(cam.position);const distance=rayDirection.length();measurementRay.set(cam.position,rayDirection.normalize());measurementRay.far=distance-.08;
  const right=new T.Vector3().setFromMatrixColumn(cam.matrixWorld,0),up=new T.Vector3().setFromMatrixColumn(cam.matrixWorld,1);
  const samples=[viewPoint.clone()];
  [-1,1].forEach(sx=>[-1,1].forEach(sy=>samples.push(viewPoint.clone().addScaledVector(right,sx*sprite.scale.x*.5).addScaledVector(up,sy*sprite.scale.y*.5))));
  const covered=samples.some(sample=>{rayDirection.copy(sample).sub(cam.position);const length=rayDirection.length();measurementRay.set(cam.position,rayDirection.normalize());measurementRay.far=length-.04;return measurementRay.intersectObjects(measurementOccluders,false).length>0;});
  const projected=viewPoint.clone().project(cam),pixelHeight=host.clientHeight/(2*Math.tan(cam.fov*Math.PI/360)*distance),width=sprite.scale.x*pixelHeight,height=sprite.scale.y*pixelHeight;
  const x=(projected.x+1)*host.clientWidth/2,y=(1-projected.y)*host.clientHeight/2;
  const box={left:x-width/2-5,right:x+width/2+5,top:y-height/2-4,bottom:y+height/2+4};
  const overlaps=occupied.some(b=>box.left<b.right&&box.right>b.left&&box.top<b.bottom&&box.bottom>b.top);
  sprite.visible=!covered&&!overlaps&&shown<12&&projected.z>-1&&projected.z<1&&Math.abs(projected.x)<1.05&&Math.abs(projected.y)<1.05;
  if(sprite.visible){occupied.push(box);shown++;}
 }
}

mirrorRuntime=()=>{
 house.scale.x=isMirrored?-X_SCALE:X_SCALE;house.position.x=isMirrored?HOUSE_WIDTH:0;
 labelGroup.children.forEach(p=>p.scale.x=isMirrored?-1:1);readableDecor.forEach(g=>g.scale.x=isMirrored?-1:1);
 solids=originalSolids.map(([x0,y0,x1,y1])=>isMirrored?[HOUSE_WIDTH-sx(x1),y0,HOUSE_WIDTH-sx(x0),y1]:[sx(x0),y0,sx(x1),y1]);
 if(mode==='walk'){playerPosition.x=HOUSE_WIDTH-playerPosition.x;yaw=-yaw;updateWalkCamera();}
 house.updateMatrixWorld(true);
};
mirrorRuntime();
function focusOrbit(m,pos,target,showRoof){sun.shadow.needsUpdate=true;avatar.visible=true;setMode(m);oc.enabled=true;ceiling.visible=showRoof;labelGroup.visible=dimensionsVisible&&!showRoof;cam.fov=48;cam.updateProjectionMatrix();cam.position.set(...pos);oc.target.set(...target);oc.update();
 note.textContent=showRoof?'Nhà hộp mái bằng, có tường chắn mái. Kéo chuột hoặc chạm để xoay; bật Kích thước để xem số đo các mặt đang nhìn; xoay để xem mặt khác.':'Đã mở mái: cửa sổ & cửa kính được bố trí theo từng phòng. Kéo để xoay; dùng chuột phải hoặc hai ngón tay để dịch, cuộn để phóng to.';}
function walkTo(r){
 setMode('walk');sun.shadow.needsUpdate=true;oc.enabled=false;ceiling.visible=true;labelGroup.visible=false;cam.fov=walkFov;cam.updateProjectionMatrix();
 const x=r?r.spot[0]:2.2,y=r?r.spot[1]:-3.8;
 playerPosition.set(isMirrored?HOUSE_WIDTH-sx(x):sx(x),0,-y);yaw=r?(isMirrored?-r.angle:r.angle):0;pitch=-.045;
 updateWalkCamera();
 note.textContent='Nhân vật cao 1,65 m · mắt cao 1,54 m. W/A/S/D hoặc nút mũi tên để đi; Q/E để quay; kéo màn hình để nhìn. Đổi nhìn theo nhân vật / qua mắt và chỉnh Góc rộng để xem thoáng hơn.';
}
document.getElementById('site-view').onclick=()=>{focusOrbit('outside',[25,30,35],[HOUSE_WIDTH/2,0,-1],true);note.textContent='Sân bê tông trước nhà 15 m, cổng và rào lưới, đường hai làn. Vườn sau sâu 10 m với cây cao thấp; đất vẫn rộng 8 m.';};
modes.outside.onclick=()=>focusOrbit('outside',[14,12,15],[HOUSE_WIDTH/2,1.7,-L/2],true);
modes.cut.onclick=()=>focusOrbit('cut',[9.8,17,6],[HOUSE_WIDTH/2,0,-L/2],false);
modes.plan.onclick=()=>{avatar.visible=false;setMode('plan');oc.enabled=false;note.textContent='Sơ đồ 2D đồng bộ với 3D. Dùng nút Kích thước để bật/tắt số đo trong 2D và 3D. Chọn phòng để xem bên trong.';layoutControls();};
modes.walk.onclick=()=>walkTo();
const pad=document.getElementById('pad');const downPoint={};
renderer.domElement.addEventListener('pointerdown',e=>{if(mode==='walk'){downPoint.id=e.pointerId;downPoint.x=e.clientX;downPoint.y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);}});
renderer.domElement.addEventListener('pointermove',e=>{if(mode==='walk'&&downPoint.id===e.pointerId){yaw-=(e.clientX-downPoint.x)*.005;pitch=Math.max(-1.23,Math.min(1.23,pitch-(e.clientY-downPoint.y)*.005));downPoint.x=e.clientX;downPoint.y=e.clientY;}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>renderer.domElement.addEventListener(ev,()=>{downPoint.id=null;}));
addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);});
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(mode==='walk'&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
pad.querySelectorAll('button').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId);
 if(mode==='walk'){
  if(k==='q'||k==='e')yaw+=(k==='q'?1:-1)*.10;
  else{const direction=k==='s'?-1:1,dx=-Math.sin(yaw)*.12*direction,dy=Math.cos(yaw)*.12*direction;
   if(!blocked(playerPosition.x+dx,-playerPosition.z))playerPosition.x+=dx;
   if(!blocked(playerPosition.x,-playerPosition.z+dy))playerPosition.z-=dy;
   stepPhase+=.45;walkingLimbs.forEach(l=>l.part.rotation.x=Math.sin(stepPhase)*.38*l.sign);
  }
  updateWalkCamera();renderer.render(scene,cam);
 }});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));});
function blocked(x,y){
 const cx=(isMirrored?HOUSE_WIDTH-x:x)/X_SCALE;
 // Cho đi từ sân 15 m qua hiên vào nhà và ra vườn sau, giữ khoảng cách rào.
 const insidePlot=cx>=siteLeft+.18/X_SCALE&&cx<=siteRight-.18/X_SCALE&&y>=frontY+.18&&y<=rearY-.18;
 if(!insidePlot)return true;
 for(const a of solids)if(x>a[0]-.18&&x<a[2]+.18&&y>a[1]-.18&&y<a[3]+.18)return true;
 return false;}

function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();}addEventListener('resize',resize);resize();
let lastShadowUpdate=0;let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min(.07,(now-last)/1000);last=now;
 if(mode==='walk'){
 const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),right=(keys.d?1:0)-(keys.a?1:0);
 yaw+=((keys.q||keys.arrowleft?1:0)-(keys.e||keys.arrowright?1:0))*1.7*dt;
 const speed=1.45*dt/Math.max(1,Math.hypot(f,right)),dx=(-Math.sin(yaw)*f+Math.cos(yaw)*right)*speed,dy=(Math.cos(yaw)*f+Math.sin(yaw)*right)*speed;
 const old=playerPosition.clone(),nx=playerPosition.x+dx,ny=-playerPosition.z+dy;
 if(!blocked(nx,-playerPosition.z))playerPosition.x=nx;if(!blocked(playerPosition.x,ny))playerPosition.z=-ny;
 const moved=old.distanceTo(playerPosition)>.0001;stepPhase+=moved?dt*8:0;
 walkingLimbs.forEach(l=>l.part.rotation.x=moved?Math.sin(stepPhase)*.38*l.sign:0);
 updateWalkCamera();
 }else if(mode!=='plan')oc.update();
 if(mode!=='plan'){if(mode==='walk'&&now-lastShadowUpdate>120){sun.shadow.needsUpdate=true;lastShadowUpdate=now;}traffic.forEach(t=>{t.car.position.x+=t.direction*t.speed*dt;if(t.car.position.x>125)t.car.position.x=-125;if(t.car.position.x< -125)t.car.position.x=125;});updateWallClock();updateMeasurementVisibility();renderer.render(scene,cam);}
}
scene.traverse(o=>{if(o.isMesh){o.receiveShadow=true;let p=o,far=false;while(p){if(p===distantLandscape||p===grassland||p.name.startsWith('road-car-')){far=true;break;}p=p.parent;}o.castShadow=!far&&!o.material.transparent&&o.name!=='outer-grass-ground'&&o.name!=='opposite-road-grass';}});
// Mặc định xem nhà có mái; khi không tải được WebGL vẫn dùng mặt bằng 2D.
modes.outside.click();requestAnimationFrame(animate);
})();
